[package]
name = "heist-vault"
version = "0.1.0"
edition = "2021"
description = "Heist: a bounty vault guarded by an AI. Talk the guardian into releasing it; the contract caps what any release can do."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
