[package]
name = "heist-bank"
version = "0.1.0"
edition = "2021"
description = "HeistBank: many AI-guarded bounty vaults with rising fees, a countdown, and sponsored vaults. The contract caps what any release can do."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
